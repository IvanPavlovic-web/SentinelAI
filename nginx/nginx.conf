worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 0;   # unlimited: large camera/drone footage uploads
    proxy_request_buffering off;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Docker's embedded DNS server. Using it with `resolver` (instead of the
    # `upstream {}` block this replaced) makes nginx re-resolve backend/
    # frontend's container IP periodically rather than once at startup/
    # reload. Without this, recreating either container (a rebuild, a
    # restart, a rolling deploy -- all routine in Docker Compose) gives it
    # a new internal IP that nginx would otherwise keep proxying to a dead
    # address for until nginx itself was manually restarted.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # Long timeouts: a multi-GB upload or a slow client connection must
        # not be cut off by the proxy layer before the backend finishes
        # receiving it.
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        location /health {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
        }

        location /ws/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            set $frontend_upstream http://frontend:5173;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
